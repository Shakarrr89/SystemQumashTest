<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e9f2;--accent:#2563eb;--on:#fff;
--green:#059669;--red:#dc2626;--orange:#d97706;--soft:color-mix(in srgb,var(--accent) 13%,var(--card));
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1220;--card:#151b2d;--text:#eef2fb;--muted:#9aa5bd;--line:#252d44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1220;--card:#151b2d;--text:#eef2fb;--muted:#9aa5bd;--line:#252d44;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif;min-height:100vh;display:flex;font-size:13px}
[dir=ltr] .side{order:-1}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:var(--text)}
button{cursor:pointer}
.side{width:260px;background:var(--card);border-inline-end:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:24px}
.brand b{font-size:30px;font-weight:800;direction:ltr;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:11px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:500;position:relative}
.nav a .ic{width:32px;height:32px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.nav a:hover{background:var(--soft)}.nav a.on{background:var(--soft);color:var(--accent);font-weight:700}
.nav a.on .ic{background:var(--accent);color:var(--on)}
.nav a.on::after{content:"";position:absolute;inset-inline-end:-18px;top:25%;bottom:25%;width:3px;background:var(--accent);border-radius:3px}
main{flex:1;min-width:0;padding:16px 22px 60px;max-width:1200px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:18px}
.top span{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#10b981}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px}
.pad{padding:22px 24px}
.row{display:flex;align-items:center;gap:12px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{gap:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mb{margin-bottom:18px}.mt{margin-top:16px}.grow{flex:1;min-width:0}
h1{font-size:24px;font-weight:700}h2{font-size:17px;font-weight:700}h3{font-size:18px;margin-bottom:14px}
.sub{color:var(--muted);font-size:11.5px;margin-top:4px}.m{color:var(--muted)}.sm{font-size:11px}
.bx{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:17px;background:var(--soft);color:var(--accent)}
.bx.s{width:32px;height:32px;font-size:15px;border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on)}.btn.g{background:var(--green);border-color:var(--green);color:#fff}.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:7px 12px;font-size:11.5px;border-radius:10px}.btn:hover{filter:brightness(.96)}.btn[disabled]{opacity:.5}
.ib{border:0;background:none;color:var(--muted);padding:7px;border-radius:9px;display:grid;place-items:center}.ib:hover{background:var(--soft);color:var(--accent)}.ib.d:hover{background:#dc262622;color:var(--red)}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#000));color:var(--on);border:0}
.hero .m{color:inherit;opacity:.8}
.big{font-size:28px;font-weight:800;margin:6px 0}
.donut{width:104px;height:104px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:19px;border-radius:50%;background:var(--card)}
.lg{display:flex;flex-direction:column;gap:7px;font-size:12px}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 13px;font-size:11.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.tx .t{flex:1;min-width:0}.tx .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx .t small{color:var(--muted);font-size:10.5px}
.amt{font-weight:800;white-space:nowrap}.e{color:var(--red)}.n{color:var(--green)}
.prog{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin:8px 0 5px}.prog i{display:block;height:100%;border-radius:8px;background:var(--accent)}
.tag{display:inline-block;font-size:10px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--accent);font-weight:600}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}.empty .bx{margin:0 auto 12px;width:56px;height:56px;font-size:26px}
dialog{border:1px solid var(--line);border-radius:22px;padding:24px;width:min(460px,94vw);max-height:92vh;background:var(--card);color:var(--text);margin:auto}
dialog::backdrop{background:rgba(10,15,30,.55)}
label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin:11px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:40px}input[type=file]{padding:8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--bg);padding:5px;border-radius:12px;margin-bottom:6px}
.seg3 button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg3 .on{background:var(--accent);color:var(--on)}.seg3 .on.exp{background:var(--red);color:#fff}.seg3 .on.inc{background:var(--green);color:#fff}
.acts{display:flex;gap:10px;margin-top:18px}.acts .btn{flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;font-size:17px;display:grid;place-items:center}
.sw button.on{border-color:var(--text)}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on);font-size:28px;font-weight:800;flex:none}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;border-bottom:1px solid var(--line)}
.bars .c{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}.bars i{width:40%;max-width:20px;border-radius:5px 5px 0 0;min-height:2px}
.xl{display:flex;gap:6px;font-size:10px;color:var(--muted);margin-top:5px}.xl span{flex:1;text-align:center}
.cr{margin-top:13px}.cr .r{display:flex;justify-content:space-between;font-weight:600;margin-bottom:5px;gap:8px}
.pv{padding:16px;border-radius:16px;border:1px solid var(--line)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.calc button{padding:15px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px;font-weight:600}
.calc .o{background:var(--soft);color:var(--accent)}.calc .eq{background:var(--accent);color:var(--on);border-color:var(--accent)}
.disp{background:var(--bg);border-radius:14px;padding:14px;text-align:end;direction:ltr;font-size:26px;font-weight:700;min-height:62px;word-break:break-all}
#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:99;pointer-events:none}
#toasts div{background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}#toasts .err{background:var(--red)}
.sec{margin-top:22px}.hide{display:none}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
@media(max-width:820px){
 body{flex-direction:column-reverse}

.hubc{text-align:start;width:100%;cursor:pointer}.hubc{display:flex;gap:14px;align-items:center;padding:20px}

/* ===== badge icons (inspired by category picker) ===== */
.bd{background:none!important;color:inherit;display:inline-grid;place-items:center;padding:0;animation:bdpop .55s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0)*24ms);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.bd svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 5px color-mix(in srgb,var(--c) 35%,transparent))}
.b0{fill:var(--c)}.b1{fill:color-mix(in srgb,var(--c) 74%,#000)}.gl{fill:#efefef}.gs{fill:rgba(0,0,0,.16);clip-path:url(#hc)}
.bd .g{transform-origin:24px 24px;animation:bob 3.6s ease-in-out infinite}
.bd:hover,.tx:hover>.bd,.pt:hover .bd,.card:hover>.row>.bd{transform:scale(1.1) rotate(-6deg)}

.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 4px;max-height:52vh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:6px 2px}

.pt .bd{width:46px;height:46px}.pt.on{background:var(--soft);color:var(--accent)}.pt .pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkb{width:100%;display:flex;align-items:center;gap:12px;padding:7px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:start;font-weight:600}

<script>
(function(){
  var API='https://cfwoicjexgexczryekmc.supabase.co', KEY='sb_publishable_NBJurc0mupUENq3_gLKdsg_tRVglAg2', AUTH_KEY='girfan-auth', APP_KEY='heda-fin-v2';
  var $=function(id){return document.getElementById(id)};
  var gate=$('gate'), form=$('gate-form'), em=$('g-email'), pw=$('g-pass'), btn=$('gate-login'), msg=$('gate-msg'), eye=$('g-eye');
  var sess=null, ready=false, saveT=null, isAdmin=false;
  var rawSet=Storage.prototype.setItem, rawRemove=Storage.prototype.removeItem;
  var nowS=function(){return Math.floor(Date.now()/1000)};

  function setMsg(m){msg.textContent=m||''}
  function busy(b){btn.disabled=b;btn.textContent=b?'…':'Sign in'}
  function friendly(e){var m=(e&&e.message)||String(e);
    if(/invalid login/i.test(m))return 'Wrong email or password.';
    if(/email not confirmed/i.test(m))return 'This account is not confirmed. Ask the administrator.';
    if(/failed to fetch|networkerror|load failed/i.test(m))return 'No connection. Check your internet and try again.';
    return m}
  function showLogin(m){form.style.display='';setMsg(m);busy(false);gate.classList.remove('boot');gate.classList.remove('hide')}

  function readStored(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}}
  function storeSess(s){sess=s;if(s)rawSet.call(localStorage,AUTH_KEY,JSON.stringify(s));else rawRemove.call(localStorage,AUTH_KEY)}
  function setSess(j){storeSess({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||(nowS()+(j.expires_in||3600)),user:j.user||(sess&&sess.user)})}

  async function parse(r){var t=await r.text();try{return t?JSON.parse(t):null}catch(e){return t}}
  async function authCall(path,body,tok){
    var h={'apikey':KEY,'Content-Type':'application/json'};
    if(tok)h['Authorization']='Bearer '+tok;
    var r=await fetch(API+'/auth/v1'+path,{method:'POST',headers:h,body:JSON.stringify(body||{})});
    var j=await parse(r);
    if(!r.ok){var e=new Error((j&&(j.error_description||j.msg||j.message||j.error))||('HTTP '+r.status));e.status=r.status;throw e}
    return j;
  }
  async function token(){
    var st=readStored();
    if(st&&st.refresh_token&&(!sess||(st.expires_at||0)>(sess.expires_at||0)))sess=st;
    if(!sess)return null;
    if((sess.expires_at||0)-60<nowS()){
      try{setSess(await authCall('/token?grant_type=refresh_token',{refresh_token:sess.refresh_token}))}
      catch(e){
        if(e.status&&e.status>=400&&e.status<500){storeSess(null);throw new Error('Your session ended. Please sign in again.')}
        throw e;
      }
    }
    return sess.access_token;
  }
  async function rest(path,opts){
    opts=opts||{};
    var t=await token();
    var h={'apikey':KEY,'Content-Type':'application/json'};
    if(t)h['Authorization']='Bearer '+t;
    if(opts.prefer)h['Prefer']=opts.prefer;
    var r=await fetch(API+'/rest/v1/'+path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
    var j=await parse(r);
    if(!r.ok){var e=new Error((j&&(j.message||j.hint))||('HTTP '+r.status));e.status=r.status;throw e}
    return j;
  }

  function heda(){var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('heda-')===0)o[k]=localStorage.getItem(k)}return o}
  function clearHeda(){Object.keys(heda()).forEach(function(k){rawRemove.call(localStorage,k)})}
  function push(data){
    return rest('finance_snapshots?on_conflict=user_id',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',
      body:{user_id:sess.user.id,data:data,updated_at:new Date().toISOString()}});
  }
  function saveNow(){
    if(!sess||!ready)return;
    push(heda()).catch(function(e){console.error('Save failed:',e.message)});
  }
  function queue(){if(!ready)return;clearTimeout(saveT);saveT=setTimeout(function(){saveT=null;saveNow()},1500)}
  Storage.prototype.setItem=function(k,v){rawSet.call(this,k,v);if(this===localStorage&&String(k).indexOf('heda-')===0)queue()};
  Storage.prototype.removeItem=function(k){rawRemove.call(this,k);if(this===localStorage&&String(k).indexOf('heda-')===0)queue()};
  function flush(){if(saveT){clearTimeout(saveT);saveT=null;saveNow()}}
  window.addEventListener('pagehide',flush);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});

  async function hydrate(){
    var rows=await rest('finance_snapshots?select=data&user_id=eq.'+sess.user.id);
    var cloud=rows&&rows[0]&&rows[0].data;
    if(cloud&&Object.keys(cloud).length){
      clearHeda();
      Object.keys(cloud).forEach(function(k){rawSet.call(localStorage,k,cloud[k])});
    }else{
      var local=heda();
      if(Object.keys(local).length)await push(local);
    }
  }

  function fillProfile(fullName,email){
    try{
      var d=JSON.parse(localStorage.getItem(APP_KEY)||'{}');
      d.user=d.user||{};
      d.user.email=email;
      if(fullName)d.user.name=fullName;
      else if(!d.user.name)d.user.name=email.split('@')[0];
      rawSet.call(localStorage,APP_KEY,JSON.stringify(d));
    }catch(e){}
  }

  window.gUser={name:'',email:''};
  window.gAcct=function(){
    var u=window.gUser||{name:'',email:''};
    var esc=function(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
    return '<section class="card pad mb"><h2>'+(isAdmin?'بەڕێوەبەر · Admin':'هەژمار · Account')+'</h2>'+
      '<div class="row sb wrap mt"><div><b style="font-size:15px">'+esc(u.name)+'</b><div class="sub" dir="ltr">'+esc(u.email)+'</div></div>'+
      '<div class="row wrap">'+(isAdmin?'<button class="btn sm" onclick="gAdmin()">بەڕێوەبەر · Admin</button>':'')+
      '<button class="btn sm r" onclick="gSignOut()">چوونەدەرەوە · Sign out</button></div></div></section>';
  };

  function unlock(){
    ready=true;
    gate.classList.add('hide');
    document.body.classList.remove('locked');
    var s=document.createElement('script');
    s.textContent=document.getElementById('app-src').textContent;
    document.body.appendChild(s);
  }

  async function enter(){
    var rows;
    try{rows=await rest('profiles?select=role,email,full_name&id=eq.'+sess.user.id)}
    catch(err){rows=await rest('profiles?select=role,email&id=eq.'+sess.user.id)}
    if(!rows||!rows.length){var e=new Error('No profile for this account. Ask the administrator.');e.noProfile=true;throw e}
    var p=rows[0];
    isAdmin=p.role==='admin';
    var email=sess.user.email||p.email||'';
    window.gUser={name:p.full_name||email.split('@')[0],email:email};
    await hydrate();
    fillProfile(p.full_name,email);
    rest('profiles?id=eq.'+sess.user.id,{method:'PATCH',prefer:'return=minimal',body:{last_seen_at:new Date().toISOString()}}).catch(function(){});
    unlock();
    queue();
  }

  async function openAdmin(){
    var m=document.getElementById('adm');
    if(!m){m=document.createElement('div');m.id='adm';document.body.appendChild(m)}
    m.textContent='';
    var card=document.createElement('div');card.className='gpanel';
    var h=document.createElement('h2');h.textContent='Users';card.appendChild(h);
    var tbl=document.createElement('table');card.appendChild(tbl);
    var close=document.createElement('button');close.textContent='Close';close.className='gclose';
    close.onclick=function(){m.style.display='none'};
    card.appendChild(close);
    m.appendChild(card);m.style.display='flex';
    m.onclick=function(e){if(e.target===m)m.style.display='none'};
    try{
      var rows;
      try{rows=await rest('profiles?select=email,full_name,role,created_at,last_seen_at,finance_snapshots(updated_at)&order=created_at.desc')}
      catch(err){rows=await rest('profiles?select=email,role,created_at,last_seen_at,finance_snapshots(updated_at)&order=created_at.desc')}
      var fmt=function(x){return x?new Date(x).toLocaleString():'—'};
      var head=document.createElement('tr');
      ['Email','Name','Role','Last seen','Data saved'].forEach(function(t){var th=document.createElement('th');th.textContent=t;head.appendChild(th)});
      tbl.appendChild(head);
      rows.forEach(function(row){
        var s=row.finance_snapshots;var sv=Array.isArray(s)?s[0]:s;
        var tr=document.createElement('tr');
        [row.email,row.full_name,row.role,fmt(row.last_seen_at),fmt(sv&&sv.updated_at)].forEach(function(v){var td=document.createElement('td');td.textContent=v||'—';tr.appendChild(td)});
        tbl.appendChild(tr);
      });
    }catch(e){tbl.textContent=e.message}
  }
  window.gAdmin=function(){openAdmin()};

  async function signOut(){
    if(saveT){clearTimeout(saveT);saveT=null;saveNow()}
    try{if(sess)await authCall('/logout',{},sess.access_token)}catch(e){}
    storeSess(null);
    clearHeda();
    location.reload();
  }
  window.gSignOut=function(){signOut()};

  eye.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    eye.setAttribute('aria-label',show?'Hide password':'Show password');
    eye.style.color=show?'var(--g-accent)':'';
  });

  form.addEventListener('submit',async function(e){
    e.preventDefault();
    setMsg('');
    var email=em.value.trim(), pass=pw.value;
    if(!email||!pass){setMsg('Enter your email and password.');return}
    busy(true);
    try{
      setSess(await authCall('/token?grant_type=password',{email:email,password:pass}));
      await enter();
    }catch(err){
      if(!sess||err.noProfile)storeSess(null);
      setMsg(friendly(err));
      busy(false);
    }
  });

  async function boot(){
    var saved=readStored();
    if(saved&&saved.refresh_token){
      sess=saved;
      form.style.display='none';
      gate.classList.add('boot');
      setMsg('');
      try{await enter();return}
      catch(e){
        if(e.noProfile||!sess)storeSess(null);
        showLogin(friendly(e));
        return;
      }
    }
    showLogin('');
  }
  boot();
})();
</script>
