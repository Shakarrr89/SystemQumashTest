<script>
(() => {
  const KEY = 'fabric-shop-theme';
  const root = document.documentElement;
  let theme = 'light';
  try { theme = localStorage.getItem(KEY) || 'light'; } catch (_) {}
  const apply = (value) => {
    theme = value === 'dark' ? 'dark' : 'light';
    root.setAttribute('data-theme', theme);
    const button = document.getElementById('theme-toggle');
    if (button) {
      button.innerHTML = theme === 'dark' ? '<span aria-hidden="true">☀</span><span>Light</span>' : '<span aria-hidden="true">☾</span><span>Dark</span>';
      button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      button.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    }
    try { localStorage.setItem(KEY, theme); } catch (_) {}
  };
  if (!document.getElementById('theme-toggle')) {
    const button = document.createElement('button');
    button.id = 'theme-toggle'; button.type = 'button';
    button.addEventListener('click', () => apply(theme === 'dark' ? 'light' : 'dark'));
    const mount = () => { const header = document.querySelector('header'); const target = header && (header.querySelector(':scope > div') || header); if (!target) return false; target.appendChild(button); return true; };
    if (!mount()) { const observer = new MutationObserver(() => { if (mount()) observer.disconnect(); }); observer.observe(document.body, {childList:true,subtree:true}); }
    apply(theme);
  }
})();
</script>
